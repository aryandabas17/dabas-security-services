<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Login</title>

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <style>

    body {

      background: #020617;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;

      color: white;

      font-family: Arial, sans-serif;

    }

    .login-box {

      width: 100%;
      max-width: 420px;

      background: rgba(255,255,255,0.04);

      border: 1px solid rgba(255,255,255,0.08);

      padding: 50px;

      border-radius: 25px;

    }

    .login-title {

      font-size: 2rem;
      font-weight: 800;

      margin-bottom: 30px;

      text-align: center;

    }

    .form-control {

      background: rgba(255,255,255,0.05);

      border: 1px solid rgba(255,255,255,0.08);

      color: white;

      padding: 14px;

      margin-bottom: 20px;

    }

    .form-control:focus {

      background: rgba(255,255,255,0.05);

      color: white;

      box-shadow: none;

      border-color: #3b82f6;

    }

    .btn-login {

      width: 100%;

      padding: 14px;

      border-radius: 12px;

      background: #2563eb;

      border: none;

      font-weight: 600;

    }

  </style>

</head>

<body>

  <div class="login-box">

    <h1 class="login-title">
      Admin Login
    </h1>

    <form id="loginForm">

      <input
        type="text"
        class="form-control"
        id="username"
        placeholder="Username"
      >

      <input
        type="password"
        class="form-control"
        id="password"
        placeholder="Password"
      >

      <button class="btn btn-primary btn-login">

        Login

      </button>

    </form>

  </div>

  <script type="module" src="./src/admin/login.js"></script>

</body>

</html>
