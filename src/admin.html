<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard</title>

  <!-- Bootstrap -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
  >

  <!-- Icons -->

  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <style>

    body {

      background: #020617;
      color: white;
      font-family: Arial, sans-serif;

    }

    .dashboard-header {

      padding: 40px 0;

    }

    .dashboard-title {

      font-size: 2.5rem;
      font-weight: 800;

    }

    .inquiry-card {

      background: rgba(255,255,255,0.04);

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 20px;

      padding: 30px;

      margin-bottom: 25px;

    }

    .inquiry-card h3 {

      font-size: 1.4rem;
      margin-bottom: 20px;

    }

    .inquiry-item {

      margin-bottom: 15px;

    }

    .inquiry-label {

      color: #3b82f6;
      font-weight: 700;

    }

  </style>

</head>

<body>

  <div class="container">

    <div class="dashboard-header">

      <h1 class="dashboard-title">
        Admin Dashboard
      </h1>

      <p>
        Manage all website inquiries
      </p>

    </div>

    <!-- INQUIRIES -->

    <div id="inquiriesContainer">

    </div>

  </div>

  <script type="module" src="./admin.js"></script>

</body>

</html>
